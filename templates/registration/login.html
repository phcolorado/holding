<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Gestão Patrimonial Familiar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body { background: #1f3864; min-height: 100vh; display: flex; align-items: center; }
        .card { border: none; border-radius: 12px; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="text-center text-white mb-4">
                <i class="bi bi-building" style="font-size: 3rem;"></i>
                <h2 class="mt-2 fw-bold">Gestão Patrimonial Familiar</h2>
                <p class="text-white-50">Acesso restrito</p>
            </div>
            <div class="card shadow-lg p-4">
                {% if form.errors %}
                <div class="alert alert-danger">Usuário ou senha inválidos.</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold">Usuário</label>
                        <input type="text" name="username" id="id_username"
                               class="form-control form-control-lg" autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="id_password" class="form-label fw-semibold">Senha</label>
                        <input type="password" name="password" id="id_password"
                               class="form-control form-control-lg">
                    </div>
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-primary btn-lg w-100">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</body>
</html>
